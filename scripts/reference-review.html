<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MEKIT · 사진 참고 렌더</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f1e8;
        color: #34432e;
        font:
          15px/1.7 -apple-system,
          BlinkMacSystemFont,
          'Apple SD Gothic Neo',
          sans-serif;
      }
      main {
        max-width: 1150px;
        margin: auto;
        padding: 40px 24px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #d7d8cc;
        padding-bottom: 18px;
      }
      .brand {
        font: 26px Georgia;
        letter-spacing: 3px;
      }
      .tag {
        font-size: 12px;
      }
      h1 {
        font-size: clamp(26px, 4vw, 42px);
        line-height: 1.3;
        margin: 32px 0 12px;
      }
      .notice {
        max-width: 760px;
        color: #626b58;
        margin-bottom: 24px;
      }
      .viewer {
        background: #e7e7dd;
        border-radius: 20px;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 4/3;
        touch-action: none;
      }
      .controls {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        margin: 20px 0 36px;
      }
      label {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      input {
        accent-color: #34432e;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      figure {
        margin: 0;
        background: #fff9;
        border-radius: 12px;
        overflow: hidden;
      }
      figure img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: contain;
      }
      figcaption {
        padding: 12px;
        font-size: 12px;
      }
      a {
        color: inherit;
      }
      details {
        margin-top: 24px;
      }
      pre {
        white-space: pre-wrap;
        font-size: 12px;
      }
      button {
        font: inherit;
        background: #34432e;
        color: white;
        border: 0;
        border-radius: 8px;
        padding: 6px 16px;
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid #b6864b;
        outline-offset: 4px;
      }
      @media (max-width: 650px) {
        .grid {
          grid-template-columns: 1fr;
        }
        main {
          padding: 24px 16px;
        }
        .tag {
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <span class="brand">MEKIT</span><span class="tag">외부 제품 참고 · 판매 화면 아님</span>
      </header>
      <h1>사진 한 장에서, 반복 가능한 렌더로.</h1>
      <p class="notice">
        사진의 윤곽과 원본 색을 사용한 2.5D 참고 렌더입니다. 깊이는 추정이며 뒷면과 실제 치수를
        복원하지 않았습니다. 이 팔찌는 MEKIT EARTH 제품이 아닙니다.
      </p>
      <div class="viewer">
        <canvas
          id="viewer"
          width="1000"
          height="750"
          aria-label="사진 텍스처를 입힌 참고 메시, 좌우·상하 각도로 비교"
        ></canvas>
      </div>
      <p id="state" role="status">렌더러를 준비하고 있습니다.</p>
      <div class="controls">
        <label
          >좌우 각도 <input id="yaw" type="range" min="-40" max="40" value="0" /><output
            id="yawValue"
            >0°</output
          ></label
        ><label
          >상하 각도 <input id="pitch" type="range" min="-40" max="40" value="0" /><output
            id="pitchValue"
            >0°</output
          ></label
        ><button id="reset">정면으로</button>
      </div>
      <div class="grid">
        <figure>
          <img id="source" alt="외부 판매처의 원본 팔찌 사진" />
          <figcaption>
            원본 판매 사진 · <a id="sourceLink" target="_blank" rel="noopener noreferrer">출처</a>
          </figcaption>
        </figure>
        <figure>
          <img id="front" alt="원본 사진 색을 사용한 정면 참고 렌더" />
          <figcaption>정면 · 원본 사진 텍스처</figcaption>
        </figure>
        <figure>
          <img id="angled" alt="깊이를 추정한 사선 참고 렌더" />
          <figcaption>사선 · 추정 깊이 · 뒷면 미복원</figcaption>
        </figure>
      </div>
      <details>
        <summary>출처와 생성 설정</summary>
        <pre id="manifest"></pre>
      </details>
    </main>
    <script id="data" type="application/json">
      __PAYLOAD__
    </script>
    <script>
      const data = JSON.parse(document.getElementById('data').textContent)
      for (const id of ['source', 'front', 'angled']) document.getElementById(id).src = data[id]
      const link = document.getElementById('sourceLink')
      if (/^https:\/\//.test(data.provenance.sourcePage)) link.href = data.provenance.sourcePage
      else link.textContent = data.provenance.sourcePage
      document.getElementById('manifest').textContent = JSON.stringify(data.provenance, null, 2)
      const canvas = document.getElementById('viewer'),
        status = document.getElementById('state'),
        yaw = document.getElementById('yaw'),
        pitch = document.getElementById('pitch')
      try {
        const gl = canvas.getContext('webgl2')
        if (!gl) throw new Error('WebGL2 미지원')
        function shader(type, source) {
          const s = gl.createShader(type)
          gl.shaderSource(s, source)
          gl.compileShader(s)
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s))
          return s
        }
        const program = gl.createProgram()
        gl.attachShader(
          program,
          shader(
            gl.VERTEX_SHADER,
            `#version 300 es
in vec3 position;in vec2 uv;out vec2 texCoord;uniform vec2 angles;
void main(){vec3 p=position/.08;float cy=cos(angles.x),sy=sin(angles.x),cx=cos(angles.y),sx=sin(angles.y);p=vec3(cy*p.x+sy*p.z,p.y,-sy*p.x+cy*p.z);p=vec3(p.x,cx*p.y-sx*p.z,sx*p.y+cx*p.z);gl_Position=vec4(p.x*1.2,p.y*1.6,-p.z*.5,1.0);texCoord=uv;}`,
          ),
        )
        gl.attachShader(
          program,
          shader(
            gl.FRAGMENT_SHADER,
            `#version 300 es
precision highp float;in vec2 texCoord;out vec4 color;uniform sampler2D photo;void main(){color=texture(photo,texCoord);if(color.a<.5)discard;}`,
          ),
        )
        gl.linkProgram(program)
        if (!gl.getProgramParameter(program, gl.LINK_STATUS))
          throw new Error(gl.getProgramInfoLog(program))
        gl.useProgram(program)
        function attribute(name, values, size) {
          const buffer = gl.createBuffer()
          gl.bindBuffer(gl.ARRAY_BUFFER, buffer)
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(values.flat()), gl.STATIC_DRAW)
          const at = gl.getAttribLocation(program, name)
          gl.enableVertexAttribArray(at)
          gl.vertexAttribPointer(at, size, gl.FLOAT, false, 0, 0)
        }
        attribute('position', data.positions, 3)
        attribute('uv', data.uvs, 2)
        const elements = gl.createBuffer()
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, elements)
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(data.indices), gl.STATIC_DRAW)
        const image = new Image()
        image.onload = () => {
          const texture = gl.createTexture()
          gl.bindTexture(gl.TEXTURE_2D, texture)
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
          gl.enable(gl.DEPTH_TEST)
          draw()
          status.textContent = '참고 렌더 준비 완료 · 드래그하거나 각도를 조절해 비교하세요.'
          canvas.dataset.ready = 'true'
        }
        image.src = data.texture
        function draw() {
          document.getElementById('yawValue').textContent = yaw.value + '°'
          document.getElementById('pitchValue').textContent = pitch.value + '°'
          gl.uniform2f(
            gl.getUniformLocation(program, 'angles'),
            (Number(yaw.value) * Math.PI) / 180,
            (Number(pitch.value) * Math.PI) / 180,
          )
          gl.viewport(0, 0, canvas.width, canvas.height)
          gl.clearColor(
            ...(data.provenance.renderBackground || [231, 231, 221]).map((v) => v / 255),
            1,
          )
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT)
          gl.drawElements(gl.TRIANGLES, data.indices.length, gl.UNSIGNED_INT, 0)
        }
        yaw.addEventListener('input', draw)
        pitch.addEventListener('input', draw)
        document.getElementById('reset').onclick = () => {
          yaw.value = pitch.value = 0
          draw()
        }
        let drag = null
        canvas.onpointerdown = (e) => {
          drag = [e.clientX, e.clientY, Number(yaw.value), Number(pitch.value)]
          canvas.setPointerCapture(e.pointerId)
        }
        canvas.onpointermove = (e) => {
          if (!drag) return
          yaw.value = Math.max(-40, Math.min(40, drag[2] + (e.clientX - drag[0]) * 0.15))
          pitch.value = Math.max(-40, Math.min(40, drag[3] + (e.clientY - drag[1]) * 0.15))
          draw()
        }
        canvas.onpointerup = canvas.onpointercancel = () => {
          drag = null
        }
      } catch (error) {
        status.textContent =
          '이 환경에서는 대화형 표시를 준비하지 못했습니다. 아래 PNG 렌더를 확인해 주세요.'
        status.dataset.error = String(error)
      }
    </script>
  </body>
</html>
