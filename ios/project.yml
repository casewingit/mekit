name: MEKIT
options:
  bundleIdPrefix: com.casewingit
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
packages:
  TryOnCore:
    path: Core
targets:
  MEKIT:
    type: application
    platform: iOS
    sources: [MEKIT]
    dependencies:
      - package: TryOnCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.casewingit.mekit.prototype
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: '손과 손목의 위치를 인식하고, 선택한 실물 사진을 2D로 배치합니다. 카메라 영상은 저장하거나 전송하지 않습니다.'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  MEKITUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MEKITUITests]
    dependencies:
      - target: MEKIT
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MEKITTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MEKITTests]
    dependencies:
      - target: MEKIT
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MEKIT:
    build:
      targets:
        MEKIT: all
    test:
      targets: [MEKITTests, MEKITUITests]
